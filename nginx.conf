server {
    listen 80;
    client_max_body_size 2m;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        return 200 "OK\n";
    }

    location /argocd/ {
        proxy_pass http://argocd-server.argocd.svc.cluster.local:80/argocd/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        sub_filter '<base href="/">' '<base href="/argocd/">';
        sub_filter_once on;
    }

    location /grafana/ {
        proxy_pass http://prometheus-grafana.monitoring.svc.cluster.local:80/grafana/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth/ {
        proxy_pass http://auth-service:8000;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/products {
        proxy_pass http://catalog-service:8000;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/internal/ {
        proxy_pass http://catalog-service:8000;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/cart {
        proxy_pass http://cart-service:8000;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/orders {
        proxy_pass http://order-service:8000;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/payments {
        proxy_pass http://payment-service:8000;
        include /etc/nginx/proxy_params.conf;
    }
}
